<div class="copyblock-container">
  <div class="copyblock-header">
    <button class="copyblock-btn" onclick="copyToClipboard(this)">Copy</button>
    <span class="copyblock-title">{{ .Get "title" | default "複製區塊" }}</span>
  </div>
  <div class="copyblock-content">
    <code>{{ .Inner | plainify }}</code>
  </div>
</div>
<script>
function copyToClipboard(btn) {
  var code = btn.parentElement.nextElementSibling.querySelector('code');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code.textContent);
  } else {
    var textarea = document.createElement('textarea');
    textarea.value = code.textContent;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }
  btn.textContent = 'Copied';
  setTimeout(function(){ btn.textContent = 'Copy'; }, 1200);
}
</script>
